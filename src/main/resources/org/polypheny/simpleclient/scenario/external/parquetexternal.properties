imageName = polypheny-parquet-benchmark:test
network = bridge
warmups = 0
runs = 1
engine = polypheny
numberOfThreads = 1
numberOfWarmUpIterations = 0

# Resources used by the DuckDB and Spark runners.
duckdbThreads = 2
duckdbMemoryLimit = 4GB
sparkShufflePartitions = 2


# Setup uses local datasets already prepared on the Polypheny machine.
setup.sources = tlcp, tlcpn, tlcpd, tlcr, tlcu, ncp, ncpd

source.tlcp.adapter = Parquet Relational
source.tlcp.directory = /Users/valdrin/PolyData/tlc_partitioned
source.tlcp.schemaMode = flat
source.tlcp.namespace = public
source.tlcp.tables = yellow_tripdata, green_tripdata, fhvhv_tripdata

source.tlcpn.adapter = Parquet Relational
source.tlcpn.directory = /Users/valdrin/PolyData/tlc_partitioned
source.tlcpn.schemaMode = normalized
source.tlcpn.namespace = public
source.tlcpn.tables = yellow_tripdata, green_tripdata, fhvhv_tripdata

source.tlcpd.adapter = Parquet Document
source.tlcpd.directory = /Users/valdrin/PolyData/tlc_partitioned
source.tlcpd.namespace = tlcpd_document
source.tlcpd.tables = yellow_tripdata, green_tripdata, fhvhv_tripdata

source.tlcr.adapter = Parquet Relational
source.tlcr.directory = /Users/valdrin/PolyData/tlc_repartitioned
source.tlcr.schemaMode = flat
source.tlcr.namespace = public
source.tlcr.tables = yellow_tripdata, green_tripdata

source.tlcu.adapter = Parquet Relational
source.tlcu.directory = /Users/valdrin/PolyData/tlc_unpartitioned
source.tlcu.schemaMode = flat
source.tlcu.namespace = public
source.tlcu.tables = yellow_tripdata, green_tripdata

# Aggregation
aggregation-sql.accessMode = sql
aggregation-sql.namespace = public
aggregation-sql.queryFile = /app/queries/aggregation/aggregation_polypheny.sql

aggregation-document.accessMode = mongoql
aggregation-document.namespace = tlcpd_document
aggregation-document.queryFile = /app/queries/aggregation/aggregation_polypheny_mql.sql

# Access Model Comparison
access-flat.accessMode = sql
access-flat.namespace = public
access-flat.queryFile = /app/queries/access_model_comparison/access_model_comparison_rf.sql

access-normalized.accessMode = sql
access-normalized.namespace = public
access-normalized.queryFile = /app/queries/access_model_comparison/access_model_comparison_rn.sql

access-document.accessMode = mongoql
access-document.namespace = tlcpd_document
access-document.queryFile = /app/queries/access_model_comparison/access_model_comparison_mql.mql

# Partitioning
partitioning.accessMode = sql
partitioning.namespace = public
partitioning.queryFile = /app/queries/partitioning/partitioning_repartitioned_unpartitioned_polypheny.sql

# DuckDB
aggregation-duckdb.engine = duckdb
aggregation-duckdb.imageName = polypheny-parquet-duckdb:test
aggregation-duckdb.dataDirectory = /Users/valdrin/PolyData/tlc_partitioned
aggregation-duckdb.queryFile = /app/queries/aggregation/aggregation_sql.sql

access-duckdb.engine = duckdb
access-duckdb.imageName = polypheny-parquet-duckdb:test
access-duckdb.dataDirectory = /Users/valdrin/PolyData/tlc_partitioned
access-duckdb.queryFile = /app/queries/access_model_comparison/access_model_comparison_sql.sql

partitioning-duckdb-partitioned.engine = duckdb
partitioning-duckdb-partitioned.imageName = polypheny-parquet-duckdb:test
partitioning-duckdb-partitioned.dataDirectory = /Users/valdrin/PolyData/tlc_repartitioned
partitioning-duckdb-partitioned.queryFile = /app/queries/partitioning/partitioning_repartitioned_sql.sql

partitioning-duckdb-unpartitioned.engine = duckdb
partitioning-duckdb-unpartitioned.imageName = polypheny-parquet-duckdb:test
partitioning-duckdb-unpartitioned.dataDirectory = /Users/valdrin/PolyData/tlc_unpartitioned
partitioning-duckdb-unpartitioned.queryFile = /app/queries/partitioning/partitioning_unpartitioned_sql.sql

# Spark
aggregation-spark.engine = spark
aggregation-spark.imageName = polypheny-parquet-spark:test
aggregation-spark.dataDirectory = /Users/valdrin/PolyData/tlc_partitioned
aggregation-spark.queryFile = /app/queries/aggregation/aggregation_sql.sql

access-spark.engine = spark
access-spark.imageName = polypheny-parquet-spark:test
access-spark.dataDirectory = /Users/valdrin/PolyData/tlc_partitioned
access-spark.queryFile = /app/queries/access_model_comparison/access_model_comparison_sql.sql

partitioning-spark-partitioned.engine = spark
partitioning-spark-partitioned.imageName = polypheny-parquet-spark:test
partitioning-spark-partitioned.dataDirectory = /Users/valdrin/PolyData/tlc_repartitioned
partitioning-spark-partitioned.queryFile = /app/queries/partitioning/partitioning_repartitioned_sql.sql

partitioning-spark-unpartitioned.engine = spark
partitioning-spark-unpartitioned.imageName = polypheny-parquet-spark:test
partitioning-spark-unpartitioned.dataDirectory = /Users/valdrin/PolyData/tlc_unpartitioned
partitioning-spark-unpartitioned.queryFile = /app/queries/partitioning/partitioning_unpartitioned_sql.sql

# Nested sources
source.ncp.adapter = Parquet Relational
source.ncp.directory = /Users/valdrin/PolyData/nested_customer
source.ncp.schemaMode = normalized
source.ncp.namespace = public
source.ncp.tables = nestedcustomer

source.ncpd.adapter = Parquet Document
source.ncpd.directory = /Users/valdrin/PolyData/nested_customer
source.ncpd.namespace = ncpd_document
source.ncpd.tables = nestedcustomer

# Nested Polypheny
nested-normalized.accessMode = sql
nested-normalized.namespace = public
nested-normalized.queryFile = /app/queries/nested_data/nested_data_polypheny_normalized.sql

nested-document.accessMode = mongoql
nested-document.namespace = ncpd_document
nested-document.queryFile = /app/queries/nested_data/nested_data_mql.mql

# Nested DuckDB
nested-duckdb.engine = duckdb
nested-duckdb.imageName = polypheny-parquet-duckdb:test
nested-duckdb.dataDirectory = /Users/valdrin/PolyData/nested_customer
nested-duckdb.nestedCustomerFile = /data/nestedcustomer.parquet
nested-duckdb.queryFile = /app/queries/nested_data/nested_data_duckdb.sql

# Nested Spark
nested-spark.engine = spark
nested-spark.imageName = polypheny-parquet-spark:test
nested-spark.dataDirectory = /Users/valdrin/PolyData/nested_customer
nested-spark.nestedCustomerFile = /data/nestedcustomer.parquet
nested-spark.queryFile = /app/queries/nested_data/nested_data_spark.sql
