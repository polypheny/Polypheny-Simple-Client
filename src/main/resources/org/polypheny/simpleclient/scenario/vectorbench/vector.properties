scenario = "vectorBench"

# Execution of queries on: polypheny | postgres
mode = polypheny

dataStoreFeature = postgresql1
dataStoreMeta = hsqldb

# Default, pgvector, PostGIS, pgvector & PostGIS
postgresImageVariant = pgvector & PostGIS

# true => DDL: REAL NOT NULL ARRAY(1,3)
# false => DDL: REAL ARRAY(1,3)
# Note: Ignored by direct postgres path
supportsNotNullArray = true

# False -> Does not create index
# Note: When run in cli, vector index will not create indexes if set to false
useIndex = true

# Query-time index parameters (direct-postgres path only, ignored on the Polypheny path).
# ---------------------------------------------------------------------------------------
# Applied via ALTER DATABASE when the index is built. Higher = better recall but slower.
# HNSW dynamic candidate list (pgvector default 40)
queryEfSearch = 40
# IVFFlat number of probes (pgvector default 1)
queryProbes = 1
# ---------------------------------------------------------------------------------------

# Number of sampled query vectors used to compute recall@k
# Note: CLI path only
numberOfRecallQueries = 100

# Vector index settings,
# Method: hnsw or ivfflat
indexMethod = hnsw
# Only used for HNSW index
indexM = 16
indexEfConstruction = 64
# Only used for IVFFlat index
indexLists = 100

# PostgreSQL direct connect settings
# Used when mode = postgres
postgresHost = localhost

numberOfThreads = 4
progressReportBase = 100
numberOfWarmUpIterations = 4

# Seeds
# Note: When running using CLI and doing an index recall this should be turned off
useRandomSeeds = false
randomSeedInsert = 46891971806236
randomSeedQuery = 196033374268

dimensionFeatureVectors = 100
batchSizeInserts = 2500
batchSizeQueries = 10

# Numbers of queries
numberOfEntries = 100000

# Int (no vector mapping)
numberOfSimpleKnnIntFeatureQueries = 0
numberOfSimpleKnnIdIntFeatureQueries = 0
numberOfMetadataKnnIntFeatureQueries = 0

numberOfSimpleMetadataQueries = 0

# Real (float vector mapping)
numberOfSimpleKnnRealFeatureQueries = 0
numberOfSimpleKnnIdRealFeatureQueries = 0
numberOfMetadataKnnRealFeatureQueries = 0
numberOfSimpleKnnRealCrossJoinQueries = 0
numberOfMetadataKnnRealCrossJoinQueries = 0
numberOfSimpleKnnRealFeatureFilteredQueries = 0

# Boolean (bit vector mapping)
numberOfSimpleKnnBooleanFeatureFilteredQueries = 10
numberOfSimpleKnnBooleanFeatureQueries = 0


limitKnnQueries = 10
# L1, L2, COSINE, INNER_PRODUCT
distanceNorm = L2
# HAMMING, JACCARD
booleanDistanceNorm = JACCARD
# Note: When ivfflat is selected as indexMethod, JACCARD and L1 indexes are not created and the step is skipped.

