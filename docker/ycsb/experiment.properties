imageName=polypheny-ycsb:test
network=benchmark-net
targets=polypheny,mongodb,postgrenosql,postgresql
workloadFile=/ycsbExternal/workloads/workloadc
jobTimeoutSeconds=900
# Warmup duration in seconds; 0 disables warmup.
warmupTime=0

ycsb.recordcount=2000
ycsb.operationcount=100000000
ycsb.maxexecutiontime=180
ycsb.threadcount=1
ycsb.fieldcount=10
ycsb.fieldlength=100
ycsb.table=usertable
ycsb.measurementtype=hdrhistogram
ycsb.readallfieldsbyname=true

target.polypheny.db.url=jdbc:polypheny://polypheny-ch2-test:20590/
target.polypheny.db.namespace=ycsb_main_20261105
target.polypheny.db.user=pa
target.polypheny.db.passwd=
target.polypheny.db.serverProjection=false
target.polypheny.db.batchsize=100
# Workload C only: use 100 for grouped reads; 1 keeps normal AutoCommit.
target.polypheny.db.readsPerTransaction=1

setup.store=ycsb_main_mongo
setup.createStore=false
setup.mongoHost=ycsb-store
setup.mongoPort=27017

target.mongodb.mongodb.url=mongodb://ycsb-reference:27017/ycsb_main_20261105?w=1
target.mongodb.mongodb.upsert=false
target.mongodb.batchsize=1

target.postgrenosql.postgrenosql.url=jdbc:postgresql://ycsb-postgres:5432/ycsb_main_20261105
target.postgrenosql.postgrenosql.user=postgres
target.postgrenosql.postgrenosql.passwd=ycsb_demo
target.postgrenosql.postgrenosql.autocommit=true

target.postgresql.db.driver=org.postgresql.Driver
target.postgresql.db.url=jdbc:postgresql://ycsb-postgres:5432/ycsb_main_20261105
target.postgresql.db.user=postgres
target.postgresql.db.passwd=ycsb_demo
target.postgresql.jdbc.autocommit=true
target.postgresql.db.batchsize=0
target.postgresql.table=usertable_jdbc
